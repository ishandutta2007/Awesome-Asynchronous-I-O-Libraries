<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .node-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    /* Ambient Pulsing Glow */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    .ambient-glow {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    /* Moving data packet flows */
    @keyframes flowForward {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowReverse {
      0% { stroke-dashoffset: -400; }
      100% { stroke-dashoffset: 0; }
    }
    .data-stream-1 {
      stroke-dasharray: 20, 40;
      animation: flowForward 10s linear infinite;
    }
    .data-stream-2 {
      stroke-dasharray: 25, 35;
      animation: flowReverse 8s linear infinite;
    }

    /* Rotating Event Loop Rings */
    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .event-loop-ring1 {
      transform-origin: 1060px 180px;
      animation: rotateClockwise 22s linear infinite;
    }
    .event-loop-ring2 {
      transform-origin: 1060px 180px;
      animation: rotateCounterClockwise 15s linear infinite;
    }
    .event-loop-ring-left {
      transform-origin: 120px 180px;
      animation: rotateCounterClockwise 28s linear infinite;
    }

    /* Floating Pill Animations */
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    .pill-1 { animation: floatSlow1 4.5s ease-in-out infinite; }
    .pill-2 { animation: floatSlow2 5.2s ease-in-out infinite; }
    .pill-3 { animation: floatSlow1 6.0s ease-in-out infinite; }
    .pill-4 { animation: floatSlow2 4.8s ease-in-out infinite; }
  </style>

  <!-- Deep Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Background Ambient Glow Behind Event Loop Core -->
  <circle cx="1060" cy="180" r="140" fill="url(#glowGlow)" class="ambient-glow" />
  <circle cx="120" cy="180" r="100" fill="url(#glowGlow)" class="ambient-glow" />

  <!-- Dynamic Animated Background Streams & Waves (strictly in background) -->
  <g opacity="0.75">
    <path d="M-50,80 C 250,20 400,150 700,70 C 950,0 1080,120 1250,90" fill="none" stroke="url(#streamGrad1)" stroke-width="3" class="data-stream-1" />
    <path d="M-50,280 C 200,330 450,220 750,300 C 950,350 1100,240 1250,270" fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" class="data-stream-2" />
    <path d="M-50,190 C 300,160 500,260 850,170 C 1020,130 1150,220 1250,190" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" />
  </g>

  <!-- Right Event Loop Geometric Core (Background Visual) -->
  <g class="event-loop-ring1" opacity="0.45">
    <circle cx="1060" cy="180" r="95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16, 24, 40, 18" />
    <circle cx="1060" cy="85" r="4" fill="#38bdf8" />
    <circle cx="1060" cy="275" r="4" fill="#818cf8" />
  </g>
  <g class="event-loop-ring2" opacity="0.35">
    <circle cx="1060" cy="180" r="68" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="28, 14, 8, 14" />
    <circle cx="992" cy="180" r="3.5" fill="#c084fc" />
    <circle cx="1128" cy="180" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Left Supporting Ring (Background Visual) -->
  <g class="event-loop-ring-left" opacity="0.25">
    <circle cx="120" cy="180" r="75" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="14, 18" />
    <circle cx="120" cy="105" r="3" fill="#06b6d4" />
  </g>

  <!-- Foreground Title, Subtitle & Branding (Always Crisp and Unobstructed) -->
  <g>
    <!-- Tagline Badge -->
    <rect x="75" y="58" width="260" height="26" rx="13" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="92" cy="71" r="4" fill="#38bdf8" />
    <text x="105" y="75" class="tagline">HIGH CONCURRENCY I/O</text>

    <!-- Main Title -->
    <text x="75" y="140" class="title" filter="url(#glow)">Awesome Asynchronous I/O</text>

    <!-- Subtitle -->
    <text x="75" y="180" class="subtitle">Curated directory of event loops, reactive architectures &amp; non-blocking network runtimes</text>
  </g>

  <!-- Interactive/Floating Framework Pill Badges (Positioned cleanly below text) -->
  <g class="pill-1">
    <rect x="75" y="222" width="125" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="94" cy="239" r="4" fill="#60a5fa" />
    <text x="107" y="243" class="node-text">epoll / kqueue</text>
  </g>

  <g class="pill-2">
    <rect x="212" y="222" width="115" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="230" cy="239" r="4" fill="#a78bfa" />
    <text x="243" y="243" class="node-text">io_uring</text>
  </g>

  <g class="pill-3">
    <rect x="339" y="222" width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="357" cy="239" r="4" fill="#f472b6" />
    <text x="370" y="243" class="node-text">Windows IOCP</text>
  </g>

  <g class="pill-4">
    <rect x="486" y="222" width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="504" cy="239" r="4" fill="#34d399" />
    <text x="517" y="243" class="node-text">Thread-Per-Core</text>
  </g>

  <g class="pill-1">
    <rect x="663" y="222" width="145" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="681" cy="239" r="4" fill="#fbbf24" />
    <text x="694" y="243" class="node-text">Zero-Copy Sockets</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="356" width="1200" height="4" rx="2" fill="url(#textGrad)" />
</svg>
